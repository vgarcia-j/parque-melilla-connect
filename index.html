<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parque Melilla Connect</title>

    <!-- Icono de pestaña (favicon) -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Icono para pantalla de inicio en iPhone / iPad (Safari) -->
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PM Connect" />

    <!-- Vinculación del manifiesto PWA para Android (Chrome) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Color de la barra de estado del teléfono -->
    <meta name="theme-color" content="#204136" />

    <!-- Tailwind CSS y colores corporativos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'pm-verde': '#204136',
              'pm-ocre': '#E3A82B',
              'pm-fondo': '#F8F9FA',
              'pm-texto': '#2B2D42',
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
